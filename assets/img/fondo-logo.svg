<!--
  Baldosa del fondo: el logo del estudio repetido, para la marca de agua que
  pinta body::before. Es el mismo dibujo que favicon.svg, ni un trazo cambiado.

  Existe como archivo aparte y no se reutiliza favicon.svg porque una sola capa
  de background no sabe dejar hueco entre repeticiones: la celda mide lo que
  mida background-size y el dibujo la llena entera, así que los logos saldrían
  pegados unos a otros. Aquí el aire va dentro del propio dibujo.

  200x200 con dos logos de 64, en (18,18) y (118,118): eso es un medio salto,
  que teje una retícula diagonal en vez de una cuadrícula de sellos alineados.
  Los dos caben enteros dentro de la baldosa, así que no hay que cuadrar nada
  en los bordes para que case.

  Si algún día cambia el logo, este archivo cambia con él.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="fondo-marco"><rect width="64" height="64" rx="7"/></clipPath>
    <clipPath id="fondo-cristal"><rect x="7" y="20.5" width="50" height="36" rx="4"/></clipPath>
    <g id="fondo-logo" clip-path="url(#fondo-marco)">
      <rect width="64" height="64" fill="#0b2350"/>
      <rect x="4.5" y="18" width="55" height="41" rx="6" fill="#06152f"/>
      <rect x="7" y="20.5" width="50" height="36" rx="4" fill="#8ba5cd"/>
      <g clip-path="url(#fondo-cristal)">
        <polygon points="54,18 60,18 60,60 30,60" fill="#9db4d8"/>
        <polygon points="42,18 54,18 30,60 18,60" fill="#a9bdd9"/>
      </g>
      <path d="M46 29c.6 4.2 1.8 5.4 6 6-4.2.6-5.4 1.8-6 6-.6-4.2-1.8-5.4-6-6 4.2-.6 5.4-1.8 6-6Z" fill="#eaeef2"/>
      <path d="M0 0h64v21a6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0Z" fill="#06152f"/>
      <path d="M0 0h64v18.8a6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0Z" fill="#eaeef2"/>
      <path d="M0 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
      <path d="M25.6 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
      <path d="M51.2 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
    </g>
  </defs>
  <use href="#fondo-logo" x="18" y="18"/>
  <use href="#fondo-logo" x="118" y="118"/>
</svg>
